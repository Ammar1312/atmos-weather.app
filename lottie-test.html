<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sunny Lottie Test</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        background: #07110f;
        color: #f6fbf8;
      }

      * {
        box-sizing: border-box;
      }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
        background:
          radial-gradient(circle at 70% 22%, rgba(255, 207, 112, 0.3), transparent 24%),
          radial-gradient(circle at 25% 80%, rgba(94, 226, 196, 0.16), transparent 30%),
          linear-gradient(145deg, #07110f, #14231f 55%, #030706);
      }

      main {
        display: grid;
        gap: 18px;
        width: min(92vw, 520px);
        padding: 28px;
        border: 1px solid rgba(255, 255, 255, 0.16);
        border-radius: 16px;
        background: rgba(3, 9, 8, 0.48);
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.34);
        text-align: center;
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
      }

      h1,
      p {
        margin: 0;
      }

      h1 {
        font-size: clamp(1.7rem, 5vw, 2.6rem);
      }

      p {
        color: rgba(246, 251, 248, 0.72);
      }

      #sunnyAnimation {
        width: min(72vw, 280px);
        aspect-ratio: 1;
        justify-self: center;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Sunny animation test</h1>
      <div id="sunnyAnimation" aria-label="Animated sunny weather icon"></div>
      <p>Preview only. This page does not affect the main weather app.</p>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/bodymovin/5.12.2/lottie.min.js"></script>
    <script>
      window.addEventListener("DOMContentLoaded", () => {
        if (!window.lottie) {
          document.querySelector("#sunnyAnimation").textContent = "Lottie player could not load.";
          return;
        }

        window.lottie.loadAnimation({
          container: document.querySelector("#sunnyAnimation"),
          renderer: "svg",
          loop: true,
          autoplay: true,
          path: "animation/sunny.json",
        });
      });
    </script>
  </body>
</html>
